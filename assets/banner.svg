<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#131b2e" />
    </linearGradient>

    <!-- Glowing Blobs Gradients -->
    <radialGradient id="cyanGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="purpleGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="pinkGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0" />
    </radialGradient>

    <!-- Title Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.5" />
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.5" />
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85" />
    </linearGradient>

    <!-- Filters -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.6" />
    </filter>
    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      @keyframes pulseBlob {
        0%, 100% { transform: scale(1) translate(0px, 0px); opacity: 0.45; }
        50% { transform: scale(1.15) translate(20px, -15px); opacity: 0.75; }
      }
      @keyframes floatCardLeft {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-10px); }
      }
      @keyframes floatCardRight {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(10px); }
      }
      @keyframes flowData {
        from { stroke-dashoffset: 200; }
        to { stroke-dashoffset: 0; }
      }
      @keyframes spinSlow {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      .blob-left { animation: pulseBlob 9s ease-in-out infinite alternate; transform-origin: 180px 150px; }
      .blob-right { animation: pulseBlob 11s ease-in-out infinite alternate-reverse; transform-origin: 1020px 240px; }
      .card-left { animation: floatCardLeft 6s ease-in-out infinite; }
      .card-right { animation: floatCardRight 7s ease-in-out infinite; }
      .data-stream { stroke-dasharray: 10 14; animation: flowData 15s linear infinite; }
      .radar-ring { animation: spinSlow 35s linear infinite; transform-origin: 600px 200px; }
      .badge-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 600; fill: #cbd5e1; }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="400" rx="16" fill="url(#bgGradient)" />
  <rect width="1196" height="396" x="2" y="2" rx="15" fill="none" stroke="url(#borderGrad)" stroke-width="2" />

  <!-- Background Grid Pattern -->
  <g opacity="0.12">
    <path d="M 0 50 L 1200 50 M 0 100 L 1200 100 M 0 150 L 1200 150 M 0 200 L 1200 200 M 0 250 L 1200 250 M 0 300 L 1200 300 M 0 350 L 1200 350" stroke="#38bdf8" stroke-width="1" />
    <path d="M 100 0 L 100 400 M 200 0 L 200 400 M 300 0 L 300 400 M 400 0 L 400 400 M 500 0 L 500 400 M 600 0 L 600 400 M 700 0 L 700 400 M 800 0 L 800 400 M 900 0 L 900 400 M 1000 0 L 1000 400 M 1100 0 L 1100 400" stroke="#38bdf8" stroke-width="1" />
  </g>

  <!-- Dynamic Animated Ambient Blobs (strictly in background) -->
  <circle cx="180" cy="150" r="170" fill="url(#cyanGlow)" class="blob-left" />
  <circle cx="1020" cy="240" r="190" fill="url(#purpleGlow)" class="blob-right" />
  <circle cx="600" cy="360" r="150" fill="url(#pinkGlow)" opacity="0.3" />

  <!-- Animated Data Flow Lines (Behind Content) -->
  <g opacity="0.25">
    <path d="M 50 80 Q 300 30 600 100 T 1150 70" fill="none" stroke="#38bdf8" stroke-width="2" class="data-stream" />
    <path d="M 50 330 Q 400 380 750 320 T 1150 340" fill="none" stroke="#c084fc" stroke-width="2" class="data-stream" />
  </g>

  <!-- Left Flanking Floating Tech Card (Immich / Self-Hosted Indicator) -->
  <g class="card-left" filter="url(#shadow)">
    <rect x="42" y="145" width="168" height="110" rx="12" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.4" />
    <circle cx="66" cy="172" r="7" fill="#10b981" />
    <text x="82" y="176" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#38bdf8">SELF-HOSTED</text>
    <text x="58" y="202" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">⚡ Immich &amp; PhotoPrism</text>
    <text x="58" y="222" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">🛡️ Zero Cloud Lock-In</text>
    <text x="58" y="242" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#64748b">100% Data Sovereignty</text>
  </g>

  <!-- Right Flanking Floating Tech Card (AI / Search Indicator) -->
  <g class="card-right" filter="url(#shadow)">
    <rect x="990" y="145" width="168" height="110" rx="12" fill="url(#cardGrad)" stroke="#c084fc" stroke-width="1.2" stroke-opacity="0.4" />
    <circle cx="1014" cy="172" r="7" fill="#8b5cf6" />
    <text x="1030" y="176" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#c084fc">ON-DEVICE AI</text>
    <text x="1006" y="202" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">🔍 CLIP Vector Search</text>
    <text x="1006" y="222" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">👤 Facial Recognition</text>
    <text x="1006" y="242" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#64748b">Local Neural Models</text>
  </g>

  <!-- Center Foreground Content Container (Always High Contrast & Visible) -->
  <!-- Top Category Tag -->
  <g transform="translate(600, 78)">
    <rect x="-135" y="-16" width="270" height="32" rx="16" fill="#1e293b" fill-opacity="0.8" stroke="#38bdf8" stroke-width="1.2" />
    <circle cx="-110" cy="0" r="4" fill="#38bdf8" />
    <text x="10" y="5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" fill="#7dd3fc" letter-spacing="1.5">OPEN-SOURCE &amp; SAAS ECOSYSTEM</text>
  </g>

  <!-- Main H1 Title -->
  <text x="600" y="160" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="900" fill="url(#titleGrad)" letter-spacing="-0.5" filter="url(#shadow)">
    Awesome Photo &amp; Video Management
  </text>

  <!-- Subtitle -->
  <text x="600" y="205" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="500" fill="#e2e8f0" letter-spacing="0.2">
    Curated Hub for Self-Hosted Media Backups, Local AI Discovery &amp; Cloud Storage Platforms
  </text>

  <!-- Secondary Descriptive Subtext -->
  <text x="600" y="235" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#94a3b8">
    Compare Self-Hosted Champions (Immich, PhotoPrism, LibrePhotos) vs Big Tech Clouds (Google, Apple, Amazon)
  </text>

  <!-- Foreground Interactive Pill Badges -->
  <g transform="translate(600, 305)">
    <!-- Pill 1: Self-Hosted -->
    <g transform="translate(-320, 0)">
      <rect x="-75" y="-18" width="150" height="36" rx="18" fill="#1e293b" fill-opacity="0.9" stroke="#0ea5e9" stroke-width="1.2" filter="url(#shadow)" />
      <text x="0" y="5" text-anchor="middle" class="badge-text">📸 Self-Hosted</text>
    </g>

    <!-- Pill 2: Local AI & CLIP -->
    <g transform="translate(-105, 0)">
      <rect x="-85" y="-18" width="170" height="36" rx="18" fill="#1e293b" fill-opacity="0.9" stroke="#8b5cf6" stroke-width="1.2" filter="url(#shadow)" />
      <text x="0" y="5" text-anchor="middle" class="badge-text">🤖 Local AI &amp; CLIP</text>
    </g>

    <!-- Pill 3: Zero-Knowledge -->
    <g transform="translate(110, 0)">
      <rect x="-80" y="-18" width="160" height="36" rx="18" fill="#1e293b" fill-opacity="0.9" stroke="#ec4899" stroke-width="1.2" filter="url(#shadow)" />
      <text x="0" y="5" text-anchor="middle" class="badge-text">🔒 Zero-Knowledge</text>
    </g>

    <!-- Pill 4: Mobile Auto-Sync -->
    <g transform="translate(315, 0)">
      <rect x="-75" y="-18" width="150" height="36" rx="18" fill="#1e293b" fill-opacity="0.9" stroke="#10b981" stroke-width="1.2" filter="url(#shadow)" />
      <text x="0" y="5" text-anchor="middle" class="badge-text">📱 Mobile Sync</text>
    </g>
  </g>
</svg>